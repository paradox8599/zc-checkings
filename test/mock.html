<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Mock Attendance</title>
</head>
<body>
<h1>Mock 考勤测试页</h1>
<button id="load">加载考勤数据</button>
<pre id="result">未加载</pre>
<script>
document.getElementById("load").onclick = async () => {
  const res = await fetch("/api/attendance/list?month=2026-07");
  const data = await res.json();
  document.getElementById("result").textContent = JSON.stringify(data, null, 2);
};
</script>
</body>
</html>
